<button routerLink="/games/ahorcado">Ahorcado</button>
<button routerLink="/resultados">Resultados</button>
@if (this.authS.usuarioActual()) {
    <p>{{ this.authS.usuarioActual()?.user_metadata?.['nombre'] }}</p>
    <button (click)="this.authS.cerrarSesion()">Cerrar sesión</button>
} @else {
    <hr />
    <button routerLink="/auth/login">Login</button>
    <button routerLink="/auth/register">Register</button>
}

<router-outlet/>
